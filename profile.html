<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soil Monoliths</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="description.css">  <!-- optional description view -->
</head>
<body class="viewer-page">
  <header class="site-header">
    <a class="brand" href="index.html" title="All profiles"><span class="brand-mark"></span>Profiles</a>
    <span class="header-sep"></span>
    <div class="header-title"><h1 id="name"></h1><div class="sub" id="sub"></div></div>
  </header>

  <div class="layout">
    <div class="stage" id="stage">
      <div id="osd"></div>

      <div class="controls">
        <div class="tools">
          <button id="zoom-in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"/></svg>Zoom in</button>
          <button id="zoom-out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6"/></svg>Zoom out</button>
          <button id="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="18" rx="1"/><path d="M3 7l2-2 2 2M5 5v14M3 17l2 2 2-2"/></svg>Full profile</button>
        </div>
        <div class="show">
          <div class="show-title">Show</div>
          <label><input type="checkbox" id="show-grid" checked> Grid</label>
          <label><input type="checkbox" id="show-horizons" checked> Horizons</label>
          <label><input type="checkbox" id="show-features" checked> Features</label>
        </div>
        <div class="show" title="Display only: the photo itself is not changed">
          <div class="show-title">Image</div>
          <label><input type="radio" name="look" value="" checked> Original</label>
          <label><input type="radio" name="look" value="vivid"> Vivid</label>
          <label><input type="radio" name="look" value="bright"> Bright</label>
          <label><input type="radio" name="look" value="contrast"> Contrast</label>
        </div>
      </div>

      <div class="leader" id="leader" hidden></div>
      <div class="callout" id="callout" hidden>
        <button class="close" id="c-close" title="Close">×</button>
        <div class="kicker" id="c-depth"></div>
        <h3 id="c-title"></h3>
        <p id="c-text"></p>
      </div>

      <div class="readout"><b id="depth">— cm</b><span id="xy">x —, y —</span></div>
      <div class="hint">Click any horizon or dot to learn more · scroll to zoom · drag to pan</div>
    </div>

    <aside class="panel" id="panel">
      <section>
        <h2>About this profile</h2>
        <p id="summary"></p>
        <dl class="facts" id="info"></dl>
      </section>

      <section><h2>Horizons</h2><ul class="list" id="horizons"></ul></section>
      <section><h2>Features</h2><ul class="list" id="features"></ul></section>
      <section class="credit"><h2>Credits</h2><p id="credit"></p></section>
    </aside>
  </div>

  <script src="lib/openseadragon/openseadragon.min.js"></script>
  <script src="viewer.js"></script>
  <script src="description.js"></script>  <!-- optional description view -->

</body>
</html>
